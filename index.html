<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AOUN Project Links</title>
  <style>
    :root{
      --green:#1f6a43;
      --green2:#2f8a5c;
      --bg:#f6fbf7;
      --card:#ffffff;
      --text:#173a28;
      --muted:#5f7468;
      --border:#dcecdf;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#f9fdf9,#eef8f0);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{
      width:min(760px,100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:0 18px 50px rgba(31,106,67,.12);
      padding:34px;
      text-align:center;
    }
    .mark{
      width:74px;height:74px;border-radius:50%;
      background:#e8f5eb;margin:0 auto 14px;
      display:flex;align-items:center;justify-content:center;
      font-size:34px;
    }
    h1{margin:0;font-size:42px;letter-spacing:.5px}
    .sub{margin:8px 0 4px;font-size:19px;font-weight:700}
    .desc{margin:0 auto 28px;max-width:620px;color:var(--muted);line-height:1.6}
    .links{display:grid;gap:14px}
    a{
      display:flex;
      align-items:center;
      justify-content:space-between;
      text-decoration:none;
      color:#fff;
      background:linear-gradient(135deg,var(--green),var(--green2));
      border-radius:16px;
      padding:18px 20px;
      font-size:18px;
      font-weight:700;
      box-shadow:0 8px 20px rgba(31,106,67,.16);
      transition:.2s transform,.2s box-shadow;
    }
    a:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(31,106,67,.22)}
    .icon{font-size:25px;margin-right:12px}
    .left{display:flex;align-items:center;text-align:left}
    .arrow{font-size:22px}
    footer{
      margin-top:26px;
      padding-top:18px;
      border-top:1px solid var(--border);
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }
    @media (max-width:520px){
      .wrap{padding:24px 18px}
      h1{font-size:34px}
      a{font-size:16px;padding:16px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark">🌿</div>
    <h1>AOUN</h1>
    <div class="sub">Unified Charity Management &amp; Integration System</div>
    <p class="desc">Choose what you want to view from the graduation project resources.</p>

    <div class="links">
      <a href="https://drive.google.com/file/d/1vadry2LjyNKlsz3M-p1iVAWSinWeuian/view?usp=sharing" target="_blank" rel="noopener">
        <span class="left"><span class="icon">🎥</span><span>Platform Demo</span></span>
        <span class="arrow">→</span>
      </a>

      <a href="https://drive.google.com/file/d/1Ymy9DvYHhXRdCB9QAOGXgFYpx9x9cpVX/view?usp=sharing" target="_blank" rel="noopener">
        <span class="left"><span class="icon">📊</span><span>Power BI Dashboards</span></span>
        <span class="arrow">→</span>
      </a>

      <a href="https://github.com/emaabdelnaby3-rgb/aoun-data-engineering-platform" target="_blank" rel="noopener">
        <span class="left"><span class="icon">💻</span><span>GitHub Repository</span></span>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>
      DigiLians · National Telecommunication Institute (NTI)<br/>
      Graduation Project · 2026
    </footer>
  </main>
</body>
</html>
